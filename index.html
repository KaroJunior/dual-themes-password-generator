<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KJ Password Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="button.css">
</head>
<body>
  <div class="theme-toggle-wrapper">
    <label class="switch">
      <input id="input" type="checkbox" />
      <div class="slider round">
        <div class="sun-moon">
          <svg id="moon-dot-1" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="moon-dot-2" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="moon-dot-3" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-1" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-2" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-3" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
    
          <svg id="cloud-1" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-2" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-3" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-4" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-5" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-6" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
        </div>
        <div class="stars">
          <svg id="star-1" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-2" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-3" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-4" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
        </div>
      </div>
  </div>
  <!-- From Uiverse.io by RiccardoRapelli --> 


  <div class="main-container">
    
    </label>
    <!-- Password Generator -->
     <h1>KJ PASSWORD GENERATOR</h1>
    <div class="container">
      <h1>Generate Password </h1>
      <label for="length">Password Length:</label>
      <input type="number" id="length" min="4" max="50" value="12">
  
      <div class="options">
        <label><input type="checkbox" id="uppercase" >Uppercase</label>
        <label><input type="checkbox" id="lowercase" >Lowercase</label>
        <label><input type="checkbox" id="numbers" >Numbers</label>
        <label><input type="checkbox" id="symbols"> Symbols</label>
      </div>
  
      <button id="generate">Generate Password</button>
  
      <div class="output-group">
        <input type="text" id="result" readonly placeholder="Your password will appear here">
        <button id="copy" title="Copy password"><img src="assets/copy.svg" alt="Copy Button"></button>
      </div>
      <p id="copyMessage" class="message"></p>
    </div>
  
    <!-- Password Strength Checker -->
    <div class="container">
      <h1>Check Password Strength </h1>
      <div class="check-group">
        <input type="text" id="checkPassword" placeholder="Type or paste a password">
        <button id="checkBtn">Check</button>
      </div>
      <p id="checkMessage" class="message"></p>
      <div id="strengthOutput">Strength: <strong>None</strong></div>
    </div>
  </div>
  
  <script src="script.js"></script>
  <script>
    const toggle = document.getElementById('input');
    
    // Check for saved theme on page load
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      toggle.checked = true;
    } else {
      document.body.classList.remove('dark-mode');
      toggle.checked = false;
    }
  
    // Listen for toggle switch
    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
  
  
</body>
</html>
